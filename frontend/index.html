<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vancouver Rental Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --border: #e4e6eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user-bubble: #2563eb;
      --bot-bubble: #f3f4f6;
      --text: #111827;
      --muted: #6b7280;
      --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    header h1 { font-size: 1.1rem; font-weight: 700; }
    header .subtitle { font-size: .8rem; color: var(--muted); }

    .icon { font-size: 1.6rem; }

    main {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* ── Chat panel ── */
    .chat-panel {
      width: 420px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg {
      display: flex;
      gap: 8px;
      max-width: 100%;
      animation: fadeUp .25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      flex-shrink: 0;
      background: #dbeafe;
    }
    .msg.user .avatar { background: var(--accent); color: #fff; }

    .bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: .88rem;
      line-height: 1.55;
      max-width: 300px;
      word-break: break-word;
    }

    .msg.bot .bubble {
      background: var(--bot-bubble);
      color: var(--text);
      border-top-left-radius: 4px;
    }
    .msg.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .typing { display: flex; gap: 5px; padding: 6px 0; align-items: center; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce .9s infinite; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(.8); opacity:.5; } 40% { transform: scale(1.1); opacity:1; } }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    #user-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      font-size: .88rem;
      outline: none;
      transition: border-color .2s;
      background: #f9fafb;
    }
    #user-input:focus { border-color: var(--accent); background: #fff; }
    #user-input:disabled { opacity: .5; cursor: not-allowed; }

    #send-btn {
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      flex-shrink: 0;
    }
    #send-btn:hover { background: var(--accent-hover); }
    #send-btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Results panel ── */
    .results-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .results-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .results-header h2 { font-size: .95rem; font-weight: 700; }
    #count-badge {
      font-size: .75rem;
      background: var(--accent);
      color: #fff;
      padding: 2px 9px;
      border-radius: 99px;
      display: none;
    }

    .results-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    /* Placeholder */
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      text-align: center;
      gap: 12px;
    }
    .placeholder .big-icon { font-size: 3.5rem; }
    .placeholder p { font-size: .88rem; max-width: 260px; line-height: 1.5; }

    /* Spinner */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      color: var(--muted);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Cards grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }

    .card-img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 2.5rem;
    }
    .card-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }

    .source-badge {
      font-size: .68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .source-Craigslist { background: #fef3c7; color: #92400e; }
    .source-Kijiji     { background: #dcfce7; color: #166534; }
    .source-livrent    { background: #ede9fe; color: #5b21b6; }

    .card-title {
      font-size: .83rem;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-address {
      font-size: .76rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc {
      font-size: .76rem;
      color: var(--muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-link {
      display: block;
      margin-top: auto;
      padding-top: 10px;
      text-align: center;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding: 8px;
      font-size: .8rem;
      font-weight: 600;
      text-decoration: none;
      transition: background .2s;
    }
    .card-link:hover { background: var(--accent-hover); }

    /* Open search links */
    .open-links {
      margin-top: 24px;
      padding: 16px;
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .open-links h3 { font-size: .85rem; font-weight: 700; margin-bottom: 10px; }
    .open-links p { font-size: .78rem; color: var(--muted); margin-bottom: 12px; }
    .link-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .link-btn {
      padding: 7px 14px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      transition: border-color .2s, background .2s;
    }
    .link-btn:hover { border-color: var(--accent); background: #eff6ff; }

    /* No results */
    .no-results {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      font-size: .88rem;
    }

    @media (max-width: 720px) {
      main { flex-direction: column; }
      .chat-panel { width: 100%; height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
      .results-panel { height: 50vh; }
    }
  </style>
</head>
<body>

<header>
  <span class="icon">🏠</span>
  <div>
    <h1>Vancouver Rental Finder</h1>
    <div class="subtitle">Tell me what you're looking for and I'll search for you</div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
    <label for="provider-select" style="font-size:.78rem;color:var(--muted);white-space:nowrap;">AI:</label>
    <select id="provider-select" style="font-size:.78rem;padding:4px 8px;border:1.5px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer;outline:none;">
      <option value="claude">Claude</option>
      <option value="openai">ChatGPT</option>
    </select>
  </div>
</header>

<main>
  <!-- Chat -->
  <div class="chat-panel">
    <div class="messages" id="messages"></div>
    <div class="input-row">
      <input id="user-input" type="text" placeholder="Type your answer..." autocomplete="off" disabled />
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>

  <!-- Results -->
  <div class="results-panel">
    <div class="results-header">
      <h2>Listings</h2>
      <span id="count-badge"></span>
    </div>
    <div class="results-scroll" id="results-scroll">
      <div class="placeholder" id="placeholder">
        <span class="big-icon">🔍</span>
        <p>Chat with the assistant on the left to describe your ideal rental. Matches will appear here.</p>
      </div>
    </div>
  </div>
</main>

<script>
  const messagesEl      = document.getElementById("messages");
  const input           = document.getElementById("user-input");
  const sendBtn         = document.getElementById("send-btn");
  const resultsScroll   = document.getElementById("results-scroll");
  const countBadge      = document.getElementById("count-badge");
  const providerSelect  = document.getElementById("provider-select");

  let history = [];   // [{role, content}]
  let searching = false;
  let currentFilters = null;

  // ── Helpers ──────────────────────────────────────────────
  function scrollChat() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = `msg ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "bot" ? "🏠" : "👤";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollChat();
  }

  function showTyping() {
    const msg = document.createElement("div");
    msg.className = "msg bot";
    msg.id = "typing-indicator";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = "🏠";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollChat();
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  function setInputEnabled(enabled) {
    input.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (enabled) input.focus();
  }

  // ── String utilities ─────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function safeUrl(u) {
    if (!u) return "#";
    return /^https?:\/\//i.test(u) ? u : "#";
  }

  // ── Results rendering ────────────────────────────────────
  function showSpinner() {
    resultsScroll.innerHTML = `
      <div class="spinner-wrap">
        <div class="spinner"></div>
        <span>Searching Craigslist, Kijiji, and liv.rent…</span>
      </div>`;
  }

  function sourceClass(source) {
    if (source === "Craigslist") return "source-Craigslist";
    if (source === "Kijiji")     return "source-Kijiji";
    return "source-livrent";
  }

  function formatPrice(p) {
    if (!p) return "Price N/A";
    return "$" + p.toLocaleString() + "/mo";
  }

  function buildOpenLinks(filters) {
    const max = filters.max_price || "";
    const min = filters.min_price || "";
    const beds = filters.min_bedrooms || 1;
    const hoods = (filters.neighborhoods || []).join(" ");

    const clQuery = encodeURIComponent(hoods || "apartment");
    const clUrl = `https://vancouver.craigslist.org/search/apa?max_price=${max}&min_bedrooms=${beds}&query=${clQuery}`;

    const kjPrice = max ? `price=__${max}` : "";
    const kjKw = hoods ? `&keywords=${encodeURIComponent(hoods)}` : "";
    const kjUrl = `https://www.kijiji.ca/b-apartments-condos/city-of-vancouver/c37l1700287?${kjPrice}${kjKw}`;

    const lrUrl = `https://liv.rent/rental-listings/canada/british-columbia/vancouver?price_max=${max}`;
    const zmUrl = `https://www.zumper.com/apartments-for-rent/vancouver-bc`;
    const pbUrl = `https://www.padmapper.com/apartments/vancouver-bc`;
    const fbUrl = `https://www.facebook.com/marketplace/category/propertyrentals?location=Vancouver,%20British%20Columbia`;

    return `
      <div class="open-links">
        <h3>Also search manually</h3>
        <p>These sites require login or were hard to scrape. Open them with your filters pre-applied:</p>
        <div class="link-btns">
          <a class="link-btn" href="${clUrl}" target="_blank">🔎 Craigslist</a>
          <a class="link-btn" href="${kjUrl}" target="_blank">🔎 Kijiji</a>
          <a class="link-btn" href="${lrUrl}" target="_blank">🔎 liv.rent</a>
          <a class="link-btn" href="${zmUrl}" target="_blank">🔎 Zumper</a>
          <a class="link-btn" href="${pbUrl}" target="_blank">🔎 PadMapper</a>
          <a class="link-btn" href="${fbUrl}" target="_blank">🔎 Facebook</a>
        </div>
      </div>`;
  }

  function renderResults(data, filters) {
    const { listings, count } = data;

    countBadge.textContent = `${count} found`;
    countBadge.style.display = count > 0 ? "inline-block" : "none";

    if (!listings || listings.length === 0) {
      resultsScroll.innerHTML = `
        <div class="no-results">
          <p>No listings found matching your criteria.</p>
          <p style="margin-top:8px">Try broadening your budget or area.</p>
        </div>
        ${buildOpenLinks(filters)}`;
      return;
    }

    const cards = listings.map(item => {
      const imgHtml = item.image
        ? `<img src="${escHtml(item.image)}" alt="listing photo" onerror="this.parentElement.innerHTML='🏢'" loading="lazy" />`
        : "🏢";

      const src = item.source || "Other";
      const cls = sourceClass(src);

      return `
        <div class="card">
          <div class="card-img">${imgHtml}</div>
          <div class="card-body">
            <div class="card-top">
              <span class="card-price">${formatPrice(item.price)}</span>
              <span class="source-badge ${cls}">${escHtml(src)}</span>
            </div>
            <div class="card-title">${escHtml(item.title || "")}</div>
            ${item.address ? `<div class="card-address">📍 ${escHtml(item.address)}</div>` : ""}
            ${item.description ? `<div class="card-desc">${escHtml(item.description)}</div>` : ""}
            <a class="card-link" href="${safeUrl(item.url)}" target="_blank" rel="noopener">View Listing →</a>
          </div>
        </div>`;
    }).join("");

    resultsScroll.innerHTML = `<div class="grid">${cards}</div>${buildOpenLinks(filters)}`;
  }

  // ── API calls ─────────────────────────────────────────────
  // onRetry: callback invoked when user clicks "Switch and retry"
  function showSwitchPrompt(failedProvider, onRetry) {
    const other      = failedProvider === "claude" ? "openai" : "claude";
    const otherLabel = failedProvider === "claude" ? "ChatGPT" : "Claude";
    const failedLabel = failedProvider === "claude" ? "Claude" : "ChatGPT";

    const otherOpt = providerSelect.querySelector(`option[value="${other}"]`);
    const canSwitch = otherOpt && !otherOpt.disabled;

    const wrapper = document.createElement("div");
    wrapper.className = "msg bot";
    wrapper.innerHTML = `
      <div class="avatar">🏠</div>
      <div class="bubble" style="display:flex;flex-direction:column;gap:10px;max-width:300px;">
        <span>Your <strong>${failedLabel}</strong> credits ran out.</span>
        ${canSwitch
          ? `<button id="switch-btn" style="padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:20px;font-size:.82rem;font-weight:600;cursor:pointer;align-self:flex-start;">Switch to ${otherLabel} and retry</button>`
          : `<span style="color:var(--muted);font-size:.82rem;">Top up at console.anthropic.com, or add a ${otherLabel} key by re-running start.bat.</span>`
        }
      </div>`;

    messagesEl.appendChild(wrapper);
    scrollChat();
    setInputEnabled(!canSwitch);

    if (canSwitch) {
      document.getElementById("switch-btn").addEventListener("click", () => {
        providerSelect.value = other;
        wrapper.remove();
        onRetry();
      });
    }
  }

  async function sendToChat(userText) {
    history.push({ role: "user", content: userText });
    setInputEnabled(false);
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, provider: providerSelect.value }),
      });

      if (res.status === 402) {
        const data = await res.json();
        removeTyping();
        history.pop();
        showSwitchPrompt(data.provider, () => {
          addMessage("user", userText);
          sendToChat(userText);
        });
        return;
      }

      const data = await res.json();
      removeTyping();

      addMessage("bot", data.message);
      history.push({ role: "assistant", content: data.message });

      if (data.filters) {
        currentFilters = data.filters;
        triggerSearch(data.filters);
      } else {
        setInputEnabled(true);
      }
    } catch (err) {
      removeTyping();
      history.pop();
      addMessage("bot", "Sorry, something went wrong. Is the backend running?");
      setInputEnabled(true);
    }
  }

  async function triggerSearch(filters) {
    showSpinner();
    searching = true;
    addMessage("bot", "Searching Craigslist, Kijiji, and liv.rent for you… this takes about 10–15 seconds.");

    try {
      const res = await fetch("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filters }),
      });
      const data = await res.json();
      renderResults(data, filters);
      addMessage("bot", "I've found the listings above! You can refine your search by telling me more (e.g. \"actually make it 2 bedrooms\" or \"add parking\").");
    } catch (err) {
      resultsScroll.innerHTML = `<div class="no-results">Search failed. Is the backend running?</div>`;
      addMessage("bot", "Search failed. Please check that the backend is running.");
    } finally {
      searching = false;
      setInputEnabled(true);
    }
  }

  async function initChat() {
    showTyping();
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: [{ role: "user", content: "__START__" }] }),
      });

      if (res.status === 402) {
        const data = await res.json();
        removeTyping();
        // history stays empty — clicking retry re-runs initChat cleanly
        showSwitchPrompt(data.provider, () => initChat());
        return;
      }

      const data = await res.json();
      removeTyping();
      addMessage("bot", data.message);
      history.push({ role: "user", content: "__START__" });
      history.push({ role: "assistant", content: data.message });
      setInputEnabled(true);
    } catch {
      removeTyping();
      const fallback = "Hi! I'll help you find rental units in Vancouver. What area(s) are you considering, and what's your budget?";
      addMessage("bot", fallback);
      history.push({ role: "user", content: "__START__" });
      history.push({ role: "assistant", content: fallback });
      setInputEnabled(true);
    }
  }

  // ── Event listeners ───────────────────────────────────────
  function handleSend() {
    const text = input.value.trim();
    if (!text || input.disabled) return;
    input.value = "";
    addMessage("user", text);
    sendToChat(text);
  }

  sendBtn.addEventListener("click", handleSend);
  input.addEventListener("keydown", e => { if (e.key === "Enter") handleSend(); });

  // ── Boot ─────────────────────────────────────────────────
  (async () => {
    try {
      const res = await fetch("/providers");
      const { providers, default: def } = await res.json();
      for (const opt of providerSelect.options) {
        if (!providers.includes(opt.value)) {
          opt.disabled = true;
          opt.text += " (no key)";
        }
      }
      if (def) providerSelect.value = def;
    } catch {}
    initChat();
  })();
</script>
</body>
</html>
